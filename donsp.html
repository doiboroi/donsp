<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quản Lý Đơn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  color: #fff;
  padding: 12px;
  font-size: 14px;
}

h2 {
  margin: 0 0 10px;
  font-size: 20px;
}

/* FORM */

input,
select {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

/* TABLE */

.table-wrap {
  width: 100%;
  overflow-x: auto;
  margin-top: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  border-radius: 10px;
}

/* HEADER */

thead th {
  background: #0f172a;
  color: #f8fafc;
  font-weight: bold;
}

/* DÒNG DỮ LIỆU */

tbody tr:nth-child(odd) {
  background: #1e293b;
}

tbody tr:nth-child(even) {
  background: #2b3a52;
}

tbody tr:hover {
  background: #3b4b66;
}

/* TỔNG */

tfoot td {
  background: #111827;
  color: #22c55e;
  font-weight: bold;
}

/* CELL */

th,
td {
  padding: 8px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* CĂN LỀ */

th:first-child,
td:first-child {
  text-align: left;
}

th:nth-child(2),
th:nth-child(3),
th:nth-child(4),
td:nth-child(2),
td:nth-child(3),
td:nth-child(4) {
  text-align: right;
}

th:last-child,
td:last-child {
  text-align: center;
}

/* EDIT */

td[contenteditable="true"] {
  cursor: text;
}

td[contenteditable="true"]:focus {
  background: #020617;
  outline: 1px solid #22c55e;
}

/* DELETE */

.delete-btn {
  width: auto;
  min-width: 30px;
  padding: 4px 8px;
  background: #ef4444;
  font-size: 12px;
}

/* SUMMARY */

.summary {
  margin-top: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
}

.line,
.profit {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.value {
  min-width: 90px;
  text-align: right;
  font-weight: bold;
}

#line3 {
  color: #facc15;
}

.profit {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #22c55e;
}

.profit .value {
  color: #facc15;
  font-size: 17px;
}

/* RATE EDIT */

#rateEdit {
  display: inline-block;
  min-width: 25px;
  text-align: center;
  border-bottom: 1px dashed #22c55e;
  outline: none;
}

/* MOBILE */

@media (max-width: 480px) {
  body {
    padding: 8px;
  }

  h2 {
    font-size: 18px;
  }

  input,
  select,
  button {
    font-size: 14px;
  }

  th,
  td {
    padding: 6px;
    font-size: 12px;
  }

  .summary {
    font-size: 12px;
  }

  .value {
    min-width: 70px;
  }
}
</style>
</head>

<body>

<h2>Danh Sách Đơn</h2>

<input id="name">
<input id="money" type="number" placeholder="Số Tiền Thanh Toán">
<select id="type">
  <option>Tiền Mặt</option>
  <option>SPP</option>
  <option>Momo</option>
</select>
<button onclick="addOrder()">Thêm</button>

<div class="table-wrap">
<table>
<thead>
<tr>
  <th>Tên</th>
  <th>Thanh Toán</th>
  <th>Xu</th>
  <th>Tổng</th>
  <th>Xóa</th>
</tr>
</thead>

<tbody id="list"></tbody>

<tfoot>
<tr>
  <td>Tổng</td>
  <td id="sumMoney"></td>
  <td id="sumXu"></td>
  <td id="sumTotal"></td>
  <td></td>
</tr>
</tfoot>
</table>
</div>

<div class="summary">
  <div class="line">
    <span>Tổng Tiền (Rate 10/10) (Trả shipper + xu)</span>
    <span class="value" id="line1"></span>
  </div>

  <br>
  Lấy từ c.H chưa làm tròn
  <!-- <hr> -->

  <div class="line">

    <span>
      Rate
      <span id="rateEdit"
            contenteditable="true"
            style="display:inline-block;min-width:25px;border-bottom:1px dashed #22c55e;">
        8
      </span>/10
      (Th.Toán + Xu ×
      <span id="rateText">0.8</span>)
    </span>
    <span class="value" id="line2"></span>
  </div>

  <br>

  <div class="line">
    <span>Lấy từ c.H đã làm tròn xuống:</span>
    <span class="value" id="line3"></span>
  </div>

  <div class="profit">
    <span>Cất vô bóp</span>
    <span class="value" id="line4"></span>
  </div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem("orders") || "[]");
let rate = Number(localStorage.getItem("rate") || "8");

window.onload = () => {
  document.getElementById("rateEdit").innerText = rate;
  document.getElementById("rateText").innerText = (rate / 10);
  resetForm();
};

document.addEventListener("DOMContentLoaded", () => {

  const rateEdit = document.getElementById("rateEdit");

  rateEdit.addEventListener("blur", () => {

    let v = Number(rateEdit.innerText.trim());

    if (isNaN(v) || v < 0) v = 0;
    if (v > 10) v = 10;

    rate = v;

    rateEdit.innerText = rate;
    document.getElementById("rateText").innerText = (rate / 10);

    localStorage.setItem("rate", rate);

    render();
  });

});


function resetForm() {
  document.getElementById("name").value = "Đơn " + (orders.length + 1);
  document.getElementById("money").value = "";
  document.getElementById("money").focus();
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Enter") addOrder();
});

function addOrder() {
  const name = document.getElementById("name").value;
  const money = Number(document.getElementById("money").value);

  if (!money) return;

  orders.push({
    name,
    money,
    xu: money,
    total: money * 2
  });

  save();
  render();
  resetForm();
}

function save() {
  localStorage.setItem("orders", JSON.stringify(orders));
}

function roundDown10k(num) {
  return Math.floor(num / 10000) * 10000;
}

function deleteRow(i) {
  orders.splice(i, 1);
  save();
  render();
  resetForm(); // FIX số đơn sau khi xóa
}

function updateCell(i, field, el) {
  let val = el.innerText.trim();

  if (field === "money") {
    val = Number(val) || 0;
    orders[i].money = val;
    orders[i].xu = val;
    orders[i].total = val * 2;
  } else {
    orders[i].name = val;
  }

  save();
  render();
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let sumMoney = 0;
  let sumXu = 0;
  let sumTotal = 0;

  orders.forEach((o, i) => {
    sumMoney += o.money;
    sumXu += o.xu;
    sumTotal += o.total;

    list.innerHTML += `
      <tr>
        <td contenteditable="true" onblur="updateCell(${i}, 'name', this)">${o.name}</td>
        <td contenteditable="true" onblur="updateCell(${i}, 'money', this)">${o.money}</td>
        <td>${o.xu}</td>
        <td>${o.total}</td>
        <td><button class="delete-btn" onclick="deleteRow(${i})">X</button></td>
      </tr>
    `;
  });

  document.getElementById("sumMoney").innerHTML = "<b>"+sumMoney+"</b>";
  document.getElementById("sumXu").innerHTML = "<b>"+sumXu+"</b>";
  document.getElementById("sumTotal").innerHTML = "<b>"+sumTotal+"</b>";

  // const rateMoney = sumMoney + sumXu * 0.8;
  const rateMoney = sumMoney + sumXu * (rate / 10);
  const floorMoney = roundDown10k(rateMoney);
  const profit = floorMoney - sumXu;

  document.getElementById("line1").innerText = sumTotal;
  document.getElementById("line2").innerText = rateMoney;
  document.getElementById("line3").innerText = floorMoney;
  document.getElementById("line4").innerText = profit;
}

render();
</script>

</body>
</html>
